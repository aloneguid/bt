name: 'Build'

env:
  BUILD_TYPE: Release
  VCPKG_HASH: d92484ed3c5020c6679d095ad3e5add907887b62

on:
  push:
    branches:
      - master
      - SignPath
    tags:
      - 'v*'              # release only when pushing a version tag
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create GitHub release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    # allow Linux build to fail while prototyping
    # continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            vcpkg_triplet: x64-windows-static
            vcpkg_config: Release
            artifact_suffix: -win-x64
            artifact_pattern: '*.msi'
          - os: windows-11-arm
            name: Windows ARM64
            vcpkg_triplet: arm64-windows-static
            vcpkg_config: Release
            artifact_suffix: -win-arm64
            artifact_pattern: '*.msi'
          - os: ubuntu-latest
            name: Linux x64
            vcpkg_triplet: x64-linux
            vcpkg_config: MinSizeRel
            artifact_suffix: -linux-x64
            artifact_pattern: '*.deb'
          - os: macos-latest
            name: Apple Silicon
            vcpkg_triplet: arm64-osx
            vcpkg_config: MinSizeRel
            artifact_suffix: -mac-arm64
            artifact_pattern: '*.dmg'
          - os: macos-26-intel
            name: Apple x64 Intel
            vcpkg_triplet: x64-osx
            vcpkg_config: MinSizeRel
            artifact_suffix: -mac-x64
            artifact_pattern: '*.dmg'

    name: 'build: ${{ matrix.name }}'
    env:
      VCPKG_DEFAULT_VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}

    steps:

    - name: 🐧 Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get --yes install cmake g++ gdb make ninja-build rsync zip libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config autoconf autoconf-archive automake libtool dpkg-dev imagemagick xvfb

    - name: 🪟 Dependencies
      if: runner.os == 'Windows'
      run: |
        dotnet tool install --global wix
        wix eula accept wix7
        wix extension add --global WixToolset.UI.wixext

    - uses: actions/checkout@v6

    - name: Create variables
      run: |
        $VERSION = (Get-Content docs/release-notes.md -Head 1).Trim() -replace '[ #]', ''
        Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$VERSION"
        Write-Host "VERSION: ${{ env.VERSION }}"
      shell: pwsh

    - uses: friendlyanon/setup-vcpkg@v1
      # seems like the absense of commit hash expects vcpkg submodule, i don't want that
      with:
        committish: ${{ env.VCPKG_HASH }}
        # set it to false to clear any cache in case of build errors
        cache: false

    - name: ⚙️ configure
      run: >
        cmake -B build -S .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D "CMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
        -D "VCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}"
        -D "CPACK_PACKAGE_VERSION=${{ env.VERSION }}"
      working-directory: .

    - name: 🏭 build
      run: cmake --build build --config ${{ matrix.vcpkg_config }}
      working-directory: .

#    - name: debug
#      run: ls -R
#      working-directory: build/bt

    - name: 🪟 🧪 unit tests
      if: runner.os == 'Windows'
      run: |
          ctest --test-dir build -C ${{ matrix.vcpkg_config }} --output-on-failure
      working-directory: .

    - name: 🐧 🧪 unit tests
      if: runner.os == 'Linux'
      run: |
          ctest --test-dir build --output-on-failure
      working-directory: .

    - name: 🍎 🧪 unit tests
      if: runner.os == 'macOS'
      run: |
          ctest --test-dir build --output-on-failure
      working-directory: .

    - name: 📦 Package Installer
      run: |
        cpack -C ${{ matrix.vcpkg_config }}
      working-directory: build

    - name: 📋 Dump WiX log on failure
      if: failure() && runner.os == 'Windows'
      shell: pwsh
      run: |
        $log = "build/_CPack_Packages/win64/WIX/wix.log"
        if (Test-Path $log) { Get-Content $log }

    - name: prep artifacts
      run: |
        mkdir atf
        cp build/${{ matrix.artifact_pattern }} atf/
        echo -n "${{ env.VERSION }}" > atf/version.txt
        cp docs/release-notes.md atf/

    - uses: actions/upload-artifact@v7
      name: collect binaries
      with:
        name: bin${{ matrix.artifact_suffix }}
        path: atf/*
        if-no-files-found: error
        compression-level: 9

  sign-artifacts:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    name: '🔐 Sign Bins'
    needs: [ build ]
    strategy:
      matrix:
        include:
          - name: Windows x64
            artifact_suffix: -win-x64
            signing_config: 'msi'
          - name: Windows ARM 64
            artifact_suffix: -win-arm64
            signing_config: 'msi'
          - name: Debian x64
            artifact_suffix: -linux-x64
            signing_config: 'deb'

    steps:
      - name: ⬇️ Download binaries
        uses: actions/download-artifact@v8
        with:
          name: bin${{ matrix.artifact_suffix }}

      - name: 🔢 Detect version and file
        run: |
          echo "VERSION=$(cat version.txt | xargs)" >> "$GITHUB_ENV"

          file=$(find . -maxdepth 1 -type f -name '*${VERSION}*' -print -quit)
          if [ -z "$file" ]; then
            echo "No file with VERSION in its name found" >&2
            exit 1
          fi
          echo "SIGN_FILE=$(basename "$file")" >> "$GITHUB_ENV"

          echo "version: $VERSION, file: $SIGN_FILE"

      - name: 🔍 view artifacts to be used
        run: ls -R
        working-directory: .

      - name: upload unsigned binary for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          path: '${{ env.SIGN_FILE }}'
          archive: 'false'
          if-no-files-found: 'error'

      - name: submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '477669b3-7c92-4586-b163-5de7dbcc35cf'
          project-slug: 'bt'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: '${{ matrix.signing_config }}'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '/signed'
          skip-decompress: 'true'
          parameters: |
            version: ${{ env.VERSION }}

  join-artifacts:
    runs-on: ubuntu-latest
    name: '🧑‍🤝‍🧑 Join Bins'
    needs: [build]
    steps:
      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true  # overwrites duplicate files

      - name: debug
        run: ls -R

      - uses: actions/upload-artifact@v7
        name: ⬆️ Upload as a single artifact
        with:
          name: bin-all
          path: '*'
          if-no-files-found: error
          compression-level: 9

  github-release:
    runs-on: ubuntu-latest
    name: '🚀 GitHub Release'
    needs: [join-artifacts]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    permissions:
      contents: write
    environment:
      name: release

    steps:

      - name: ⬇️ Download binaries
        uses: actions/download-artifact@v8
        with:
          name: bin-all

      - name: 🔍 view artifacts to be used
        run: ls -R
        working-directory: .

      - name: 🔢 set version environment variable
        run: |
          echo "VERSION=$(cat version.txt | xargs)" >> "$GITHUB_ENV"

      - name: 🔢 prep release notes / artifacts
        run: |
          grep -m 2 -B 1000 '^## ' release-notes.md | tail -n +3 | head -n -2 > final_notes.md
          cat final_notes.md

      - name: 🔍 view artifacts to be used
        run: ls -R
        working-directory: .

      # https://github.com/softprops/action-gh-release
      - name: 📦 create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          # this token is required for the release action to work because it also triggers another workflow
          # permissions: "contents: read and write"
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          name: ${{ env.VERSION }}
          files: |
            *.msi
            *.deb
          # not yet, but close: *.dmg
          body_path: final_notes.md
