name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["bug", "triage"]
assignees:
  - octocat
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **House Rules (Non‑Negotiable Edition):**  
        This project does **not** allow the use of Large Language Models (LLMs) for writing code, filing issues, submitting bug reports, crafting pull requests, or anything else even vaguely resembling contribution. This does **not** mean I am anti AI or LLMs are not allowed.
        
        If your submission looks like it was generated by an LLM, it will be treated like spam, closed with extreme prejudice, and your account may be blocked.  
        
        Please write like a human. Preferably a helpful one.
  - type: input
    id: libversion
    attributes:
      label: Library Version
      description: Tell us the exact Parquet.Net version. "Latest" is not a version, it's a lifestyle.
      placeholder: ex. 6.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS and Architecture
      description: Select the OS and architecture where the bug decided to ruin your day.
      options:
        - Windows (64-bit)
        - Windows (ARM 64)
        - Linux (64-bit)
        - Other (please specify)
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: How to reproduce?
      description: Provide the exact steps to reproduce the issue. If the steps aren't clear, the issue will be closed faster than you can say "works on my machine."
      value: "..."
    validations:
      required: true
